services:
  # For this container to scrape the host-run service, the service must bind
  # metrics.host = "0.0.0.0" (see config/local.toml.example) — the default
  # 127.0.0.1 is loopback-only and unreachable via host.docker.internal.
  prometheus:
    image: prom/prometheus:latest
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Linux: reach the host service
